<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>{{TITULO}} — Dossier ATHA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #FFFFFF;
      --bg-card: #F3F3F3;
      --text-primary: #111111;
      --text-secondary: #444444;
      --accent-gold: #D4AF37;
      --accent-red: #B91C1C;
      --font-display: 'Montserrat', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-body);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    .page {
      width: 210mm;
      height: 297mm;
      padding: 14mm 16mm 18mm 16mm;
      background-color: var(--bg-dark);
      color: var(--text-primary);
      font-family: var(--font-body);
      position: relative;
      page-break-after: always;
      overflow: hidden;
    }
    .page:last-child { page-break-after: auto; }
    .brand-logo-footer {
      position: absolute;
      left: 16mm;
      bottom: 16mm;
      height: 9mm;
      width: auto;
      z-index: 3;
    }
    .page-number {
      position: absolute;
      right: 16mm;
      bottom: 16mm;
      font-size: 9pt;
      color: var(--text-secondary);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      z-index: 3;
    }
    .label {
      display: inline-block;
      color: var(--accent-red);
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 9.5pt;
      margin-bottom: 8mm;
      position: relative;
      z-index: 2;
    }
    .cover-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 54pt;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: #111111;
      margin-bottom: 4mm;
      position: relative;
      z-index: 2;
    }
    .cover-subtitle {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 17pt;
      color: var(--accent-red);
      margin-bottom: 6mm;
      position: relative;
      z-index: 2;
    }
    .cover-desc {
      font-size: 11.5pt;
      color: var(--text-secondary);
      line-height: 1.6;
      max-width: 170mm;
      position: relative;
      z-index: 2;
    }
    .cover-footer {
      position: absolute;
      left: 16mm; right: 16mm; bottom: 26mm;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.5pt;
      color: var(--text-secondary);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-top: 0.5mm solid rgba(0,0,0,0.1);
      padding-top: 3.5mm;
      z-index: 2;
    }
    .page-title {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 25pt;
      letter-spacing: -0.02em;
      color: #111111;
      padding-left: 10mm;
      border-left: 4px solid var(--accent-red);
      margin-bottom: 8mm;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
    }
    .prose {
      font-size: 11.5pt;
      line-height: 1.75;
      color: var(--text-secondary);
      max-width: 172mm;
      position: relative;
      z-index: 2;
    }
    .two-col {
      display: flex;
      gap: 14mm;
      margin-top: 7mm;
      align-items: stretch;
      flex: 1;
      position: relative;
      z-index: 2;
    }
    .two-col > div { flex: 1; }
    .card {
      background: var(--bg-card);
      border-radius: 2mm;
      padding: 14mm 11mm 11mm;
      border: 0.3mm solid rgba(0,0,0,0.05);
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1.6mm;
      background: linear-gradient(90deg, var(--accent-red), var(--accent-gold));
    }
    .card h3 {
      color: var(--accent-red);
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12.5pt;
      margin-bottom: 5.5mm;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .card p {
      font-style: italic;
      font-size: 11pt;
      color: var(--text-secondary);
      line-height: 1.7;
    }
    .artist-image {
      width: 100%;
      height: 44mm;
      background-position: center;
      background-size: cover;
      border-radius: 1.5mm;
      margin-bottom: 7mm;
      border: 0.3mm solid rgba(0,0,0,0.08);
      box-shadow: 0 16px 40px rgba(0,0,0,0.08);
      position: relative;
      z-index: 2;
    }
    .pull-quote {
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 14pt;
      color: var(--accent-red);
      padding: 4.5mm 0 4.5mm 10mm;
      border-left: 2.5px solid rgba(0,0,0,0.18);
      margin: 7mm 0;
      letter-spacing: 0.02em;
      position: relative;
      z-index: 2;
    }
    .requirements-list {
      list-style: none;
      padding: 0;
      margin-top: 6mm;
      position: relative;
      z-index: 2;
    }
    .requirements-list li {
      font-size: 11pt;
      color: var(--text-secondary);
      padding: 3.5mm 0 3.5mm 7.5mm;
      border-bottom: 0.3mm solid rgba(0,0,0,0.06);
      position: relative;
    }
    .requirements-list li::before {
      content: "—";
      position: absolute;
      left: 0;
      color: var(--accent-red);
      font-weight: 700;
    }
    .divider {
      height: 0.3mm;
      background: rgba(0,0,0,0.06);
      margin: 7mm 0;
      position: relative;
      z-index: 2;
    }
  </style>
</head>
<body>
  {{COMPONENT_PORTADA}}
  {{COMPONENT_SINOPSIS}}
  {{COMPONENT_PROPUESTA}}
  {{COMPONENT_REQUERIMIENTOS}}
  {{COMPONENT_CONTACTO}}
</body>
</html>
