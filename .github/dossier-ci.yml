name: Dossier CI

on:
  push:
    paths:
      - 'payload_*.json'
      - 'tokens/**'
      - 'schema/**'
      - 'generate_dossier.py'
      - 'assemble_html.py'
      - 'render_docx.py'
      - 'post_process_docx.py'
  workflow_dispatch:

jobs:
  teatro:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.head_commit.message, 'teatro') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python generate_dossier.py payload_flautisc0.json cinematic-dark
      - run: python render_docx.py
      - run: python post_process_docx.py
      - uses: actions/upload-artifact@v4
        with:
          name: dossier-teatro-docx
          path: out/dossier.docx
      - run: cp out/dossier.pdf out/${{ github.event.repository.name }}-teatro.pdf

  musical:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.head_commit.message, 'musical') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python generate_dossier.py payload_flautisc0.json cinematic-dark
      - run: python render_docx.py
      - run: python post_process_docx.py
      - uses: actions/upload-artifact@v4
        with:
          name: dossier-musical-docx
          path: out/dossier.docx

  eventos:
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.event.head_commit.message, 'evento') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install -r requirements.txt
      - run: python generate_dossier.py payload_flautisc0.json light
      - run: python render_docx.py
      - run: python post_process_docx.py
      - uses: actions/upload-artifact@v4
        with:
          name: dossier-evento-docx
          path: out/dossier.docx
